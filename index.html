<!DOCTYPE html>
<html lang="ro" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubblehub SRL - Flotă Parteneră Bolt Food & Wolt Galați</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#080314',
                        cardBg: '#120826',
                        cardBorder: 'rgba(168, 85, 247, 0.2)',
                        accentPurple: '#a855f7',
                        accentDarkPurple: '#7e22ce',
                        highlightPink: '#ec4899',
                        glowViolet: '#c084fc',
                    },
                    boxShadow: {
                        'violet-glow': '0 0 35px -5px rgba(168, 85, 247, 0.35)',
                        'violet-card': '0 10px 30px -10px rgba(168, 85, 247, 0.15)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #080314;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }
        section {
            scroll-margin-top: 5rem;
        }
        .glass-panel {
            background: rgba(18, 8, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.18);
        }
        .glass-nav {
            background: rgba(8, 3, 20, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
        }
        .gradient-text {
            background: linear-gradient(135deg, #f3e8ff 0%, #c084fc 50%, #e879f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #1e1138;
            height: 8px;
            border-radius: 6px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c084fc, #9333ea);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.8);
            border: 2px solid #ffffff;
            transition: transform 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        .logo-transparent {
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.4));
        }
        .badge-glow {
            animation: pulseGlow 3s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }
            100% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.7); }
        }
    </style>
</head>
<body class="antialiased selection:bg-accentPurple selection:text-white">

    <!-- BUTON FLOTANT RAPID PENTRU ÎNSCRIERE -->
    <button onclick="openSignupModal()" class="fixed bottom-5 right-5 sm:bottom-6 sm:right-6 z-50 flex items-center gap-2.5 bg-gradient-to-r from-accentPurple to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white px-4 py-3 sm:px-5 sm:py-3.5 rounded-full shadow-[0_0_25px_rgba(168,85,247,0.5)] hover:scale-105 transition-all duration-300 font-bold text-xs sm:text-sm">
        <i class="fa-solid fa-paper-plane text-lg sm:text-xl"></i>
        <span>Înscrie-te în Flotă</span>
    </button>

    <!-- NAVBAR -->
    <header class="fixed top-0 left-0 w-full z-40 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <a href="#" class="flex items-center gap-3 group py-1">
                <img src="logo.png" alt="Bubblehub SRL Logo" class="h-12 sm:h-16 w-auto object-contain logo-transparent group-hover:scale-105 transition-transform">
            </a>

            <nav class="hidden md:flex items-center space-x-6 lg:space-x-8 text-sm font-medium text-gray-300">
                <a href="#beneficii" class="hover:text-purple-300 transition-colors">Avantaje</a>
                <a href="#comparatie" class="hover:text-purple-300 transition-colors">De ce Noi?</a>
                <a href="#calculator" class="hover:text-purple-300 transition-colors">Calculator</a>
                <a href="#incepatori" class="hover:text-purple-300 transition-colors">Pentru Începători</a>
                <a href="#galati" class="hover:text-purple-300 transition-colors">Hub Galați</a>
                <a href="#bonusuri" class="hover:text-purple-300 transition-colors">Comision</a>
            </nav>

            <div class="hidden sm:flex items-center gap-4">
                <button onclick="openSignupModal()" class="relative inline-flex items-center justify-center p-0.5 overflow-hidden text-sm font-semibold rounded-xl group bg-gradient-to-br from-purple-500 via-accentPurple to-pink-500 text-white shadow-violet-glow hover:scale-[1.02] transition-transform duration-200">
                    <span class="relative px-5 py-2.5 bg-darkBg rounded-[10px] group-hover:bg-opacity-0 font-bold">
                        Devino Curier
                    </span>
                </button>
            </div>

            <button id="mobileMenuBtn" class="md:hidden text-gray-300 hover:text-white p-2 text-xl focus:outline-none">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <div id="mobileMenu" class="hidden md:hidden glass-panel border-b border-accentPurple/20 px-4 pt-3 pb-6 space-y-3">
            <a href="#beneficii" onclick="toggleMobileMenu()" class="block px-3 py-2 rounded-lg hover:bg-purple-900/40 text-gray-200 font-medium">Avantaje</a>
            <a href="#comparatie" onclick="toggleMobileMenu()" class="block px-3 py-2 rounded-lg hover:bg-purple-900/40 text-gray-200 font-medium">De ce Noi?</a>
            <a href="#calculator" onclick="toggleMobileMenu()" class="block px-3 py-2 rounded-lg hover:bg-purple-900/40 text-gray-200 font-medium">Calculator</a>
            <a href="#incepatori" onclick="toggleMobileMenu()" class="block px-3 py-2 rounded-lg hover:bg-purple-900/40 text-gray-200 font-medium">Pentru Începători</a>
            <a href="#galati" onclick="toggleMobileMenu()" class="block px-3 py-2 rounded-lg hover:bg-purple-900/40 text-gray-200 font-medium">Hub Galați</a>
            <a href="#bonusuri" onclick="toggleMobileMenu()" class="block px-3 py-2 rounded-lg hover:bg-purple-900/40 text-gray-200 font-medium">Comision</a>
            <button onclick="toggleMobileMenu(); openSignupModal();" class="w-full mt-2 py-3 bg-gradient-to-r from-accentPurple to-pink-600 rounded-xl font-bold text-white shadow-lg">
                Înscrie-te Acum
            </button>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="relative pt-32 pb-16 md:pt-44 md:pb-28 overflow-hidden">
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] sm:w-[600px] h-[300px] sm:h-[600px] bg-accentPurple/20 rounded-full blur-[100px] sm:blur-[140px] pointer-events-none"></div>
        <div class="absolute top-1/3 right-10 w-[200px] sm:w-[300px] h-[200px] sm:h-[300px] bg-pink-600/15 rounded-full blur-[80px] sm:blur-[100px] pointer-events-none"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass-panel
